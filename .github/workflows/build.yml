name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Static binary
        run: make binary
      - name: Image
        run: docker build -f Containerfile --build-arg VERSION="$(git describe --tags --always)" -t www-c0de:ci .
      - uses: actions/upload-artifact@v7
        with:
          name: c0de-www-linux-amd64
          path: dist/c0de-www
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Go tests
        run: go test ./cmd/... ./internal/...
      - name: Vitest
        working-directory: site
        run: npm ci && npm test
