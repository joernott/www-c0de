name: End-to-end tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Image
        run: docker build -f Containerfile -t www-c0de:e2e .
      - name: Start the container
        # The token lifts the rate limit of GitHub for /api/version (task 12.2).
        env:
          C0DE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run -d --name www-c0de -p 80:8080 -p 443:8443 \
            -e C0DE_DOMAIN=localhost -e C0DE_TLS=internal -e C0DE_GITHUB_TOKEN www-c0de:e2e
          for _ in $(seq 30); do
            curl -fsk -o /dev/null https://localhost/ && exit 0
            sleep 1
          done
          docker logs www-c0de
          exit 1
      - name: Browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium firefox
      - name: Tests
        working-directory: e2e
        run: npm test
      - name: Lighthouse
        working-directory: e2e
        run: npm run lighthouse
      - name: Container log
        if: failure()
        run: docker logs www-c0de
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/lighthouse/
