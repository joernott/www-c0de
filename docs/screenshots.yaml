    code: |
      PROGRAM nameboard
      NOOP
      INCLUDE c0de/strings
      INCLUDE c0de/math
      NOOP
      CONSTANT WIDTH INTEGER 32
      NOOP
      FUNCTION center
          PARAMETER text STRING
          RESULT result STRING
      BEGIN
          VARIABLE inner INTEGER
          VARIABLE length INTEGER
          VARIABLE before INTEGER
          VARIABLE left STRING
          VARIABLE right STRING
          ASSIGN inner WIDTH - 2 ;
          CALL LEN
              PARAMETER value text ;
              RESULT result length
          IF length > inner ;
          BEGIN
              CALL c0de/strings/LEFT
                  PARAMETER text text ;
                  PARAMETER length inner - 3 ;
                  RESULT result text
              ASSIGN text text ⊕ "..." ;
              ASSIGN length inner ;
          END IF
          CALL c0de/math/DIV
              PARAMETER dividend inner - length ;
              PARAMETER divisor 2 ;
              RESULT result before
          CALL c0de/strings/SPACE
              PARAMETER count before ;
              RESULT result left
          CALL c0de/strings/SPACE
              PARAMETER count inner - length - before ;
              RESULT result right
          ASSIGN result "|" ⊕ left ⊕ text ⊕ right ⊕ "|" ;
      END FUNCTION
      NOOP
      FUNCTION show
          PARAMETER name STRING
          PARAMETER title STRING "Welcome to the base of"
      BEGIN
          VARIABLE border STRING
          VARIABLE line STRING
          VARIABLE first STRING
          VARIABLE rest STRING
          VARIABLE length INTEGER
          CALL c0de/strings/FILL
              PARAMETER count WIDTH - 2 ;
              PARAMETER char '=' ;
              RESULT result border
          ASSIGN border "+" ⊕ border ⊕ "+" ;
          CALL c0de/strings/UCASE
              PARAMETER text title ;
              RESULT result title
          CALL LEN
              PARAMETER value name ;
              RESULT result length
          CALL c0de/strings/LEFT
              PARAMETER text name ;
              PARAMETER length 1 ;
              RESULT result first
          CALL c0de/strings/UCASE
              PARAMETER text first ;
              RESULT result first
          CALL c0de/strings/RIGHT
              PARAMETER text name ;
              PARAMETER length length - 1 ;
              RESULT result rest
          CALL c0de/strings/LCASE
              PARAMETER text rest ;
              RESULT result rest
          CALL CLS
          CALL PRINT
              PARAMETER value border ;
          CALL center
              PARAMETER text "" ;
              RESULT result line
          CALL PRINT
              PARAMETER value line ;
          CALL center
              PARAMETER text title ;
              RESULT result line
          CALL PRINT
              PARAMETER value line ;
          CALL center
              PARAMETER text first ⊕ rest ;
              RESULT result line
          CALL PRINT
              PARAMETER value line ;
          CALL center
              PARAMETER text "" ;
              RESULT result line
          CALL PRINT
              PARAMETER value line ;
          CALL PRINT
              PARAMETER value border ;
      END FUNCTION
  - id: commands-laptop
    file: site/public/tutorials/screenshots/commands-laptop.webp
    page: site/tutorials/libraries/c0de/strings/commands.md
    title: Reading commands
    description: "the terminal of the laptop after the run: the typed commands say, sum and dance with their answers, and Bye! at the end"
    program: commands
    program_file: site/tutorials/programs/libraries/strings/commands-terminal.c0de
    function: terminal
    sheet: 42
    x: 1344
    code: |
      PROGRAM commands
      NOOP
      INCLUDE c0de/strings
      INCLUDE c0de/math
      NOOP
      FUNCTION split
          PARAMETER line STRING
          RESULT word STRING
          RESULT rest STRING
      BEGIN
          VARIABLE space INTEGER
          CALL c0de/strings/INSTR
              PARAMETER text line ;
              PARAMETER search " " ;
              RESULT result space
          IF space < 0 ;
          BEGIN
              ASSIGN word line ;
              RETURN
          END IF
          CALL c0de/strings/MID
              PARAMETER text line ;
              PARAMETER start 0 ;
              PARAMETER length space ;
              RESULT result word
          CALL c0de/strings/MID
              PARAMETER text line ;
              PARAMETER start space + 1 ;
              RESULT result rest
      END FUNCTION
      NOOP
      FUNCTION say
          PARAMETER text STRING
      BEGIN
          VARIABLE found INTEGER
          CALL c0de/strings/INSTR
              PARAMETER text text ;
              PARAMETER search "creeper" ;
              RESULT result found
          WHILE found ≥ 0 ;
          BEGIN
              CALL c0de/strings/REPLACE
                  PARAMETER text text ;
                  PARAMETER start found ;
                  PARAMETER insert "*******" ;
                  RESULT result text
              CALL c0de/strings/INSTR
                  PARAMETER text text ;
                  PARAMETER search "creeper" ;
                  PARAMETER start found ;
                  RESULT result found
          END WHILE
          CALL PRINT
              PARAMETER value text ;
      END FUNCTION
      NOOP
      FUNCTION sum
          PARAMETER numbers STRING
      BEGIN
          VARIABLE first STRING
          VARIABLE second STRING
          VARIABLE a FLOAT
          VARIABLE b FLOAT
          VARIABLE wholeA BOOLEAN
          VARIABLE wholeB BOOLEAN
          VARIABLE total INTEGER
          VARIABLE answer STRING
          VARIABLE problem ERROR
          CALL split
              PARAMETER line numbers ;
              RESULT word first
              RESULT rest second
          CALL c0de/strings/VAL problem
              PARAMETER text first ;
              RESULT value a
              RESULT isInteger wholeA
          CALL c0de/strings/VAL problem
              PARAMETER text second ;
              RESULT value b
              RESULT isInteger wholeB
          IF problem.code ≠ 0 OR NOT ( wholeA AND wholeB ) ;
          BEGIN
              CALL PRINT
                  PARAMETER value "? sum needs two whole numbers" ;
              RETURN
          END IF
          CALL c0de/math/FIX
              PARAMETER value a + b ;
              RESULT result total
          CALL c0de/strings/STR
              PARAMETER value total ;
              RESULT result answer
          CALL PRINT
              PARAMETER value first ⊕ " + " ⊕ second ⊕ " = " ⊕ answer ;
      END FUNCTION
      NOOP
      FUNCTION terminal
      BEGIN
          VARIABLE line STRING
          VARIABLE word STRING
          VARIABLE rest STRING
          CALL CLS
          CALL PRINT
              PARAMETER value "Commands: say <text>, sum <a> <b>, quit" ;
          REPEAT
          BEGIN
              CALL INPUT
                  PARAMETER variable line ;
              CALL split
                  PARAMETER line line ;
                  RESULT word word
                  RESULT rest rest
              IF word = "say" ;
              BEGIN
                  CALL say
                      PARAMETER text rest ;
              END IF
              IF word = "sum" ;
              BEGIN
                  CALL sum
                      PARAMETER numbers rest ;
              END IF
              IF word ≠ "say" AND word ≠ "sum" AND word ≠ "quit" ;
              BEGIN
                  CALL PRINT
                      PARAMETER value "? unknown command: " ⊕ word ;
              END IF
          END REPEAT word ≠ "quit" ;
          CALL PRINT
              PARAMETER value "Bye!" ;
      END FUNCTION
