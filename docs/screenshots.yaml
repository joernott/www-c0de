    file: site/public/tutorials/screenshots/secret-messages-laptop.webp
    page: site/tutorials/libraries/c0de/strings/secret-messages.md
    title: Secret messages
    description: "the terminal of the laptop after the run: the typed message and key, the secret text and the decoded message"
    program: caesar
    program_file: site/tutorials/programs/libraries/strings/secret-messages-caesar.c0de
    function: laptop
