    title: Is my c0de up to date?
    description: "The display wall with the two green lines c0de 0.7.1: up to date and c0de net 0.4.0: up to date"
    program: versioncheck
    program_file: site/tutorials/programs/libraries/http/up-to-date-check.c0de
    function: check
    sheet: 84
    x: 2688
    code: |
      PROGRAM versioncheck
      NOOP
      INCLUDE c0de/strings
      INCLUDE c0de_net/http
      NOOP
      STRUCT releases
      BEGIN
          c0de STRING
          net STRING TAG(json: "c0de_net")
      END STRUCT
      NOOP
      FUNCTION compare
          PARAMETER name STRING
          PARAMETER installed STRING
          PARAMETER latest STRING
          RESULT current BOOLEAN
      BEGIN
          ASSIGN current installed = latest ;
          IF current ;
          BEGIN
              CALL COLOR
                  PARAMETER foreground COLOR_GREEN ;
              CALL PRINT
                  PARAMETER value name ⊕ " " ⊕ installed ⊕ ": up to date" ;
          END
          ELSE
          BEGIN
              CALL COLOR
                  PARAMETER foreground COLOR_RED ;
              CALL PRINT
                  PARAMETER value name ⊕ " " ⊕ installed ⊕ ": " ⊕ latest ⊕ " is out" ;
          END IF
          CALL COLOR
              PARAMETER foreground COLOR_WHITE ;
      END FUNCTION
      NOOP
      FUNCTION check
          RESULT current BOOLEAN
      BEGIN
          VARIABLE api STRUCT c0de_net/http/HTTP_CONNECTION
          VARIABLE answer STRING
          VARIABLE latest STRUCT releases
          VARIABLE netCurrent BOOLEAN
          ASSIGN api.use_ssl TRUE ;
          ASSIGN api.server "c0de.at" ;
          ASSIGN api.timeout 10 ;
          CALL c0de_net/http/HTTP_GET
              PARAMETER connection api ;
              PARAMETER endpoint "/api/version" ;
              RESULT result answer
          CALL c0de/strings/FROM_JSON
              PARAMETER source answer ;
              PARAMETER destination latest ;
          CALL CLS
          CALL compare
              PARAMETER name "c0de" ;
              PARAMETER installed C0DE_VERSION ;
              PARAMETER latest latest.c0de ;
              RESULT current current
          CALL compare
              PARAMETER name "c0de net" ;
              PARAMETER installed C0DE_NET_VERSION ;
              PARAMETER latest latest.net ;
              RESULT current netCurrent
          ASSIGN current current AND netCurrent ;
      END FUNCTION
  - id: checking-input-laptop
    file: site/public/tutorials/screenshots/checking-input-laptop.webp
    page: site/tutorials/libraries/c0de/strings/checking-input.md
    title: Checking input
    description: "the screen of the laptop after the run: the rejected names and coordinates with their ? answers, and the welcome line at the end"
    program: checking
    program_file: site/tutorials/programs/libraries/strings/checking-input-signup.c0de
    function: signup
    sheet: 86
    x: 2752
    code: |
      PROGRAM checking
      NOOP
      INCLUDE c0de/strings
      NOOP
      FUNCTION askName
          RESULT name STRING
      BEGIN
          VARIABLE ok BOOLEAN
          REPEAT
          BEGIN
              CALL PRINT
                  PARAMETER value "Your name:" ;
              CALL INPUT
                  PARAMETER variable name ;
              CALL c0de/strings/REGEX_MATCH
                  PARAMETER text name ;
                  PARAMETER pattern "^[A-Za-z0-9_]{3,16}$" ;
                  RESULT result ok
              IF NOT ok ;
              BEGIN
                  CALL PRINT
                      PARAMETER value "? 3 to 16 letters, digits or _" ;
              END IF
          END REPEAT NOT ok ;
      END FUNCTION
      NOOP
      FUNCTION askHome
          RESULT home STRING
      BEGIN
          VARIABLE ok BOOLEAN
          REPEAT
          BEGIN
              CALL PRINT
                  PARAMETER value "Your home (x y z):" ;
              CALL INPUT
                  PARAMETER variable home ;
              CALL c0de/strings/REGEX_REPLACE
                  PARAMETER text home ;
                  PARAMETER pattern "[ ,]+" ;
                  PARAMETER replacement " " ;
                  PARAMETER flags "g" ;
                  RESULT result home
              CALL c0de/strings/REGEX_REPLACE
                  PARAMETER text home ;
                  PARAMETER pattern "^ | $" ;
                  PARAMETER replacement "" ;
                  PARAMETER flags "g" ;
                  RESULT result home
              CALL c0de/strings/REGEX_MATCH
                  PARAMETER text home ;
                  PARAMETER pattern "^-?[0-9]+ -?[0-9]+ -?[0-9]+$" ;
                  RESULT result ok
              IF NOT ok ;
              BEGIN
                  CALL PRINT
                      PARAMETER value "? three whole numbers, like 12 64 -30" ;
              END IF
          END REPEAT NOT ok ;
      END FUNCTION
      NOOP
      FUNCTION signup
      BEGIN
          VARIABLE name STRING
          VARIABLE home STRING
          VARIABLE coordinates STRING
          CALL CLS
          CALL askName
              RESULT name name
          CALL askHome
              RESULT home home
          CALL c0de/strings/REGEX_REPLACE
              PARAMETER text home ;
              PARAMETER pattern "(-?[0-9]+) (-?[0-9]+) (-?[0-9]+)" ;
              PARAMETER replacement "x=\\1 y=\\2 z=\\3" ;
              RESULT result coordinates
          CALL PRINT
              PARAMETER value "Welcome, " ⊕ name ⊕ "! Home: " ⊕ coordinates ;
      END FUNCTION
