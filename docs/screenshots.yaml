  - id: shapes-window
    file: site/public/tutorials/screenshots/shapes-window.webp
    page: site/tutorials/libraries/c0de_paint/cpaint/shapes.md
    title: Shapes in any plane
    description: the wall of stone bricks, 13 × 13 blocks, with the round window of light blue glass in its middle, framed by polished andesite and divided by a cross of dark oak planks, the trigger block with its button in front of its west end
    program: roundwindow
    program_file: site/tutorials/programs/libraries/paint/shapes-window.c0de
    function: window
    sheet: 106
    x: 3392
    code: |
      PROGRAM roundwindow
      NOOP
      INCLUDE c0de/minecraft
      INCLUDE c0de_paint/cpaint
      NOOP
      FUNCTION solid
          PARAMETER id STRING
          RESULT result TYPE c0de_paint/cpaint/STYLE
      BEGIN
          VARIABLE block STRUCT c0de_paint/cpaint/BLOCK
          ASSIGN block.id id ;
          CALL c0de_paint/cpaint/STYLE_SOLID
              PARAMETER block block ;
              RESULT result result
      END FUNCTION
      NOOP
      FUNCTION window
          PARAMETER r INTEGER 4
      BEGIN
          VARIABLE c TYPE c0de_paint/cpaint/CANVAS
          VARIABLE a STRUCT c0de_paint/cpaint/POINT
          VARIABLE b STRUCT c0de_paint/cpaint/POINT
          VARIABLE m STRUCT c0de_paint/cpaint/POINT
          VARIABLE wall TYPE c0de_paint/cpaint/STYLE
          VARIABLE rim TYPE c0de_paint/cpaint/STYLE
          VARIABLE glass TYPE c0de_paint/cpaint/STYLE
          VARIABLE frame TYPE c0de_paint/cpaint/STYLE
          VARIABLE at STRUCT c0de/minecraft/POSITION
          CALL solid
              PARAMETER id "stone_bricks" ;
              RESULT result wall
          CALL solid
              PARAMETER id "polished_andesite" ;
              RESULT result rim
          CALL solid
              PARAMETER id "light_blue_stained_glass" ;
              RESULT result glass
          CALL solid
              PARAMETER id "dark_oak_planks" ;
              RESULT result frame
          // the wall: a rectangle standing upright
          ASSIGN b.x 2 * r + 4 ;
          ASSIGN m.y 2 * r + 4 ;
          CALL c0de_paint/cpaint/DRAW_RECTANGLE
              PARAMETER canvas c ;
              PARAMETER a a ;
              PARAMETER b b ;
              PARAMETER c m ;
              PARAMETER fill_style wall ;
          // the window: a circle in the same plane
          ASSIGN m.x r + 2 ;
          ASSIGN m.y r + 2 ;
          ASSIGN a.x 2 * r + 2 ;
          ASSIGN a.y r + 2 ;
          ASSIGN b.x r + 2 ;
          ASSIGN b.y 2 * r + 2 ;
          CALL c0de_paint/cpaint/DRAW_ELLIPSE
              PARAMETER canvas c ;
              PARAMETER center m ;
              PARAMETER a a ;
              PARAMETER b b ;
              PARAMETER line_style rim ;
              PARAMETER fill_style glass ;
          // the cross of the window frame
          ASSIGN a.x 3 ;
          ASSIGN b.x 2 * r + 1 ;
          ASSIGN b.y r + 2 ;
          CALL c0de_paint/cpaint/DRAW_LINE
              PARAMETER canvas c ;
              PARAMETER from a ;
              PARAMETER to b ;
              PARAMETER style frame ;
          ASSIGN a.x r + 2 ;
          ASSIGN a.y 3 ;
          ASSIGN b.x r + 2 ;
          ASSIGN b.y 2 * r + 1 ;
          CALL c0de_paint/cpaint/DRAW_LINE
              PARAMETER canvas c ;
              PARAMETER from a ;
              PARAMETER to b ;
              PARAMETER style frame ;
          // build it 2 blocks east of the trigger block
          ASSIGN at.x PID.x + 2 ;
          ASSIGN at.y PID.y ;
          ASSIGN at.z PID.z ;
          CALL c0de_paint/cpaint/RENDER_CANVAS
              PARAMETER canvas c ;
              PARAMETER position at ;
      END FUNCTION
  - id: shapes-star
    file: site/public/tutorials/screenshots/shapes-star.webp
    page: site/tutorials/libraries/c0de_paint/cpaint/shapes.md
    title: Shapes in any plane
    description: the five-pointed star set into the grass, white concrete with a rim of gold blocks and a sea lantern in its middle, seen from above, the trigger block 2 blocks west of its western tip
    program: floorstar
    program_file: site/tutorials/programs/libraries/paint/shapes-star.c0de
    function: star
    sheet: 108
    x: 3456
    code: |
      PROGRAM floorstar
      NOOP
      INCLUDE c0de/math
      INCLUDE c0de/minecraft
      INCLUDE c0de_paint/cpaint
      NOOP
      FUNCTION solid
          PARAMETER id STRING
          RESULT result TYPE c0de_paint/cpaint/STYLE
      BEGIN
          VARIABLE block STRUCT c0de_paint/cpaint/BLOCK
          ASSIGN block.id id ;
          CALL c0de_paint/cpaint/STYLE_SOLID
              PARAMETER block block ;
              RESULT result result
      END FUNCTION
      NOOP
      FUNCTION star
          PARAMETER r INTEGER 8
      BEGIN
          VARIABLE c TYPE c0de_paint/cpaint/CANVAS
          VARIABLE p STRUCT c0de_paint/cpaint/POINT
          VARIABLE corners ARRAY STRUCT c0de_paint/cpaint/POINT
          VARIABLE gold TYPE c0de_paint/cpaint/STYLE
          VARIABLE white TYPE c0de_paint/cpaint/STYLE
          VARIABLE light TYPE c0de_paint/cpaint/STYLE
          VARIABLE at STRUCT c0de/minecraft/POSITION
          VARIABLE angle FLOAT
          VARIABLE radius FLOAT
          VARIABLE f FLOAT
          CALL solid
              PARAMETER id "gold_block" ;
              RESULT result gold
          CALL solid
              PARAMETER id "white_concrete" ;
              RESULT result white
          CALL solid
              PARAMETER id "sea_lantern" ;
              RESULT result light
          // 10 corners: tips and notches take turns
          FOR i INTEGER 0 ; 9 ;
          BEGIN
              ASSIGN radius r ;
              IF i \ 2 = 1 ;
              BEGIN
                  ASSIGN radius r * 2 / 5 ;
              END IF
              ASSIGN angle ( i / 5 - 0.5 ) * c0de/math/PI ;
              CALL c0de/math/COS
                  PARAMETER value angle ;
                  RESULT result f
              CALL c0de/math/ROUND
                  PARAMETER value radius * f ;
                  RESULT result p.x
              CALL c0de/math/SIN
                  PARAMETER value angle ;
                  RESULT result f
              CALL c0de/math/ROUND
                  PARAMETER value radius * f ;
                  RESULT result p.z
              ASSIGN corners[i] p ;
          END FOR
          CALL c0de_paint/cpaint/DRAW_POLYGON
              PARAMETER canvas c ;
              PARAMETER points corners ;
              PARAMETER line_style gold ;
              PARAMETER fill_style white ;
          // a lamp in the middle
          ASSIGN p.x 0 ;
          ASSIGN p.z 0 ;
          CALL c0de_paint/cpaint/DRAW_BLOCK
              PARAMETER canvas c ;
              PARAMETER point p ;
              PARAMETER style light ;
          // into the floor, its middle r + 2 blocks east
          ASSIGN at.x PID.x + r + 2 ;
          ASSIGN at.y PID.y - 1 ;
          ASSIGN at.z PID.z ;
          CALL c0de_paint/cpaint/RENDER_CANVAS
              PARAMETER canvas c ;
              PARAMETER position at ;
      END FUNCTION
