  - id: guess-the-number-sheet
    file: site/public/tutorials/screenshots/guess-the-number-sheet.webp
    page: site/tutorials/learning/guess-the-number.md
    title: "Project: guess the number"
    description: the whole program guess on its sheet, seen from above at the south end, with the function secretNumber at the top and the REPEAT loop of the function play below it
    program: guess
    program_file: site/tutorials/programs/learning/guess-the-number-guess.c0de
    function: play
    sheet: 30
    x: 960
    code: |
      PROGRAM guess
      NOOP
      INCLUDE c0de/math
      NOOP
      FUNCTION secretNumber
          RESULT number INTEGER
      BEGIN
          VARIABLE chance FLOAT
          CALL c0de/math/RANDOM
              RESULT result chance
          CALL c0de/math/INT
              PARAMETER value chance * 100 + 1 ;
              RESULT result number
      END FUNCTION
      NOOP
      FUNCTION play
      BEGIN
          VARIABLE secret INTEGER
          VARIABLE guess INTEGER
          VARIABLE tries INTEGER
          CALL secretNumber
              RESULT number secret
          CALL CLS
          CALL COLOR
              PARAMETER foreground COLOR_YELLOW ;
          CALL PRINT
              PARAMETER value "I am thinking of a number from 1 to 100." ;
          REPEAT
          BEGIN
              CALL INPUT
                  PARAMETER variable guess ;
              ASSIGN tries tries + 1 ;
              IF guess < secret ;
              BEGIN
                  CALL COLOR
                      PARAMETER foreground COLOR_AQUA ;
                  CALL PRINT
                      PARAMETER value guess ⊕ " is too low. Go higher!" ;
              END IF
              IF guess > secret ;
              BEGIN
                  CALL COLOR
                      PARAMETER foreground COLOR_LIGHT_PURPLE ;
                  CALL PRINT
                      PARAMETER value guess ⊕ " is too high. Go lower!" ;
              END IF
          END REPEAT guess ≠ secret ;
          CALL COLOR
              PARAMETER foreground COLOR_GREEN ;
          CALL PRINT
              PARAMETER value "Right! You needed " ⊕ tries ⊕ " tries." ;
      END FUNCTION
