  - id: decisions-guard-sheet
    file: site/public/tutorials/screenshots/decisions-guard-sheet.webp
    page: site/tutorials/learning/decisions.md
    title: Making decisions
    description: the program guard on its sheet in the c0de dimension, seen from above at the south end, with the IF and ELSE lines in the middle and all line numbers dark green
    program: guard
    program_file: site/tutorials/programs/learning/decisions-guard.c0de
    function: check
    sheet: 14
    x: 448
    code: |
      PROGRAM guard
      NOOP
      CONSTANT BASE STRING "Oak Hill"
      NOOP
      FUNCTION check
      BEGIN
          VARIABLE visitor STRING
          VARIABLE isOwner BOOLEAN
          ASSIGN visitor PID.activator ;
          ASSIGN isOwner visitor = SHEET.owner ;
          CALL CLS
          IF isOwner ;
          BEGIN
              CALL PRINT
                  PARAMETER value "Welcome home, " ⊕ visitor ⊕ "!" ;
          END
          ELSE
          BEGIN
              CALL PRINT
                  PARAMETER value "Hello, " ⊕ visitor ⊕ "!" ;
              CALL PRINT
                  PARAMETER value BASE ⊕ " is closed." ;
          END IF
      END FUNCTION
