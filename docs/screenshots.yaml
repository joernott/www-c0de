  - id: calculating-stacks
    file: site/public/tutorials/screenshots/calculating-stacks.webp
    page: site/tutorials/learning/calculating.md
    title: Calculating
    description: the program "stacks" on its sheet, seen from above, with the OPERATOR blocks of lines 14 to 23 visible
    program: stacks
    program_file: site/tutorials/programs/learning/calculating-stacks.c0de
    function: calculate
    sheet: 8
    x: 256
    activate: /function c0de_screenshots:activate/calculating-stacks
    code: |
      PROGRAM stacks
      NOOP
      INCLUDE c0de/math
      NOOP
      FUNCTION calculate
      BEGIN
          VARIABLE items INTEGER 1000
          VARIABLE size INTEGER 64
          VARIABLE stacks INTEGER
          VARIABLE rest INTEGER
          CALL c0de/math/DIV
              PARAMETER dividend items ;
              PARAMETER divisor size ;
              RESULT result stacks
          ASSIGN rest items \ size ;
          CALL CLS
          CALL PRINT
              PARAMETER value items ⊕ " items" ;
          CALL PRINT
              PARAMETER value "= " ⊕ items / size ⊕ " stacks" ;
          CALL PRINT
              PARAMETER value "= " ⊕ stacks ⊕ " stacks + " ⊕ rest ⊕ " items" ;
          CALL PRINT
              PARAMETER value "Check: " ⊕ stacks * size + rest ;
      END FUNCTION
