  - id: condition-loops-halving-sheet
    file: site/public/tutorials/screenshots/condition-loops-halving-sheet.webp
    page: site/tutorials/learning/condition-loops.md
    title: Loops with a condition
    description: the program halving on its sheet, seen from the south end, showing the REPEAT block with the WHILE loop indented inside it
    program: halving
    program_file: site/tutorials/programs/learning/condition-loops-halving.c0de
    function: halve
    sheet: 18
    x: 576
    code: |
      PROGRAM halving
      NOOP
      NOOP
      FUNCTION halve
      BEGIN
          VARIABLE number INTEGER
          VARIABLE half FLOAT
          VARIABLE steps INTEGER
          VARIABLE again STRING
          REPEAT
          BEGIN
              CALL PRINT
                  PARAMETER value "Type a number:" ;
              CALL INPUT
                  PARAMETER variable number ;
              ASSIGN half number ;
              ASSIGN steps 0 ;
              WHILE half > 1 ;
              BEGIN
                  ASSIGN half half / 2 ;
                  ASSIGN steps steps + 1 ;
              END WHILE
              CALL PRINT
                  PARAMETER value "You can halve " ⊕ number ⊕ " " ⊕ steps ⊕ " times." ;
              CALL PRINT
                  PARAMETER value "Another number? (yes/no)" ;
              CALL INPUT
                  PARAMETER variable again ;
          END REPEAT again = "yes" ;
          CALL PRINT
              PARAMETER value "Bye!" ;
      END FUNCTION
