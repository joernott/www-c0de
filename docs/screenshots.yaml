          ASSIGN b.y height - 1 ;
          CALL c0de_paint/cpaint/DRAW_BOX
              PARAMETER canvas c ;
              PARAMETER from a ;
              PARAMETER to b ;
              PARAMETER fill_style stripes ;
          ASSIGN site.x PID.x + 2 ;
          ASSIGN site.y PID.y ;
          ASSIGN site.z PID.z ;
          CALL c0de_paint/cpaint/RENDER_CANVAS
              PARAMETER canvas c ;
              PARAMETER position site ;
