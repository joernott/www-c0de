  - id: dice-display
    file: site/public/tutorials/screenshots/dice-display.webp
    page: site/tutorials/libraries/c0de/math/dice.md
    title: Rolling dice
    description: 'a display block next to a trigger block with a button, showing "D20: 15", "D20: 4", "D20: 6" and "Total: 25"'
    program: anydie
    program_file: site/tutorials/programs/libraries/math/dice-roll.c0de
    function: roll
    sheet: 34
    x: 1088
    code: |
      PROGRAM anydie
      NOOP
      INCLUDE c0de/math
      NOOP
      FUNCTION roll
          PARAMETER sides INTEGER 6
          PARAMETER count INTEGER 1
          PARAMETER seed INTEGER 0
          RESULT total INTEGER
      BEGIN
          VARIABLE chance FLOAT
          VARIABLE die INTEGER
          IF seed ≠ 0 ;
          BEGIN
              CALL c0de/math/RANDOMIZE
                  PARAMETER seed seed ;
          END IF
          CALL CLS
          FOR i INTEGER 1 ; count ;
          BEGIN
              CALL c0de/math/RANDOM
                  RESULT result chance
              CALL c0de/math/INT
                  PARAMETER value chance * sides + 1 ;
                  RESULT result die
              CALL PRINT
                  PARAMETER value "D" ⊕ sides ⊕ ": " ⊕ die ;
              ASSIGN total total + die ;
          END FOR
          CALL PRINT
              PARAMETER value "Total: " ⊕ total ;
      END FUNCTION
  - id: circle-ring
    file: site/public/tutorials/screenshots/circle-ring.webp
    page: site/tutorials/libraries/c0de/math/circle.md
    title: Drawing a circle
    description: a ring of stone bricks with the radius 5 on flat grass around a trigger block with a button, seen from above at an angle
    program: ring
    program_file: site/tutorials/programs/libraries/math/circle-ring.c0de
    function: draw
    sheet: 36
    x: 1152
    code: |
      PROGRAM ring
      NOOP
      INCLUDE c0de/math
      INCLUDE c0de/minecraft
      STRUCT offset
      BEGIN
          x INTEGER
          z INTEGER
      END STRUCT
      NOOP
      FUNCTION points
          PARAMETER radius INTEGER 3
          RESULT spots ARRAY STRUCT offset
      BEGIN
          VARIABLE steps INTEGER
          VARIABLE angle FLOAT
          VARIABLE cosine FLOAT
          VARIABLE sine FLOAT
          VARIABLE spot STRUCT offset
          VARIABLE count INTEGER
          VARIABLE last INTEGER
          ASSIGN steps 8 * radius ;
          FOR i INTEGER 0 ; steps - 1 ;
          BEGIN
              ASSIGN angle 2 * c0de/math/PI * i / steps ;
              CALL c0de/math/COS
                  PARAMETER value angle ;
                  RESULT result cosine
              CALL c0de/math/SIN
                  PARAMETER value angle ;
                  RESULT result sine
              CALL c0de/math/ROUND
                  PARAMETER value radius * cosine ;
                  RESULT result spot.x
              CALL c0de/math/ROUND
                  PARAMETER value radius * sine ;
                  RESULT result spot.z
              CALL LEN
                  PARAMETER value spots ;
                  RESULT result count
              IF count = 0 ;
              BEGIN
                  ASSIGN spots[0] spot ;
              END
              ELSE
              BEGIN
                  ASSIGN last count - 1 ;
                  IF spot ≠ spots[last] AND spot ≠ spots[0] ;
                  BEGIN
                      ASSIGN spots[count] spot ;
                  END IF
              END IF
          END FOR
      END FUNCTION
      NOOP
      FUNCTION draw
          PARAMETER radius INTEGER 5
          PARAMETER block STRING "minecraft:stone_bricks"
      BEGIN
          VARIABLE spots ARRAY STRUCT offset
          VARIABLE here STRUCT c0de/minecraft/POSITION
          VARIABLE problem ERROR
          VARIABLE placed INTEGER
          VARIABLE skipped INTEGER
          CALL points
              PARAMETER radius radius ;
              RESULT spots spots
          ASSIGN here.y PID.y ;
          EACH spot spots
          BEGIN
              ASSIGN here.x PID.x + spot.x ;
              ASSIGN here.z PID.z + spot.z ;
              CALL c0de/minecraft/PLACE_BLOCK problem
                  PARAMETER position here ;
                  PARAMETER id block ;
              IF problem.code = 0 ;
              BEGIN
                  ASSIGN placed placed + 1 ;
              END
              ELSE
              BEGIN
                  ASSIGN skipped skipped + 1 ;
              END IF
          END EACH
          CALL c0de/minecraft/SAY
              PARAMETER message placed ⊕ " blocks placed, " ⊕ skipped ⊕ " spots were taken" ;
      END FUNCTION
  - id: growth-display
    file: site/public/tutorials/screenshots/growth-display.webp
    page: site/tutorials/libraries/c0de/math/growth.md
    title: Growth
    description: 'a display block showing the lines "Day 0: 1" to "Day 7: 128"'
    program: farm
    program_file: site/tutorials/programs/libraries/math/growth-farm.c0de
    function: grow
    sheet: 38
    x: 1216
    code: |
      PROGRAM farm
      NOOP
      INCLUDE c0de/math
      NOOP
      FUNCTION grow
          PARAMETER start INTEGER 1
          PARAMETER factor FLOAT 2.0
          PARAMETER days INTEGER 7
          RESULT count INTEGER
      BEGIN
          VARIABLE rate FLOAT
          VARIABLE growth FLOAT
          CALL c0de/math/LOG
              PARAMETER value factor ;
              RESULT result rate
          CALL CLS
          FOR day INTEGER 0 ; days ;
          BEGIN
              CALL c0de/math/EXP
                  PARAMETER value day * rate ;
                  RESULT result growth
              CALL c0de/math/ROUND
                  PARAMETER value start * growth ;
                  RESULT result count
              CALL PRINT
                  PARAMETER value "Day " ⊕ day ⊕ ": " ⊕ count ;
          END FOR
      END FUNCTION
      NOOP
      FUNCTION daysUntil
          PARAMETER start INTEGER 1
          PARAMETER factor FLOAT 2.0
          PARAMETER goal INTEGER 1000
          RESULT days INTEGER
      BEGIN
          VARIABLE ratio FLOAT
          VARIABLE rate FLOAT
          IF goal ≤ start ;
          BEGIN
              RETURN
          END IF
          CALL c0de/math/LOG
              PARAMETER value goal / start ;
              RESULT result ratio
          CALL c0de/math/LOG
              PARAMETER value factor ;
              RESULT result rate
          CALL c0de/math/INT
              PARAMETER value 0 - ratio / rate ;
              RESULT result days
          ASSIGN days 0 - days ;
          IF start * factor ^ ( days - 1 ) ≥ goal ;
          BEGIN
              ASSIGN days days - 1 ;
          END IF
      END FUNCTION
      NOOP
      FUNCTION digits
          PARAMETER number INTEGER
          RESULT digits INTEGER
      BEGIN
          VARIABLE logarithm FLOAT
          VARIABLE ten FLOAT
          CALL c0de/math/LOG
              PARAMETER value number ;
              RESULT result logarithm
          CALL c0de/math/LOG
              PARAMETER value 10 ;
              RESULT result ten
          CALL c0de/math/INT
              PARAMETER value logarithm / ten ;
              RESULT result digits
          ASSIGN digits digits + 1 ;
          IF 10 ^ digits ≤ number ;
          BEGIN
              ASSIGN digits digits + 1 ;
          END IF
      END FUNCTION
