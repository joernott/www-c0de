    title: A name board
    description: the display wall of 2 × 1 blocks with the frame of = signs, the greeting WELCOME TO THE BASE OF and the name Steve
    program: nameboard
    program_file: site/tutorials/programs/libraries/strings/name-board-frame.c0de
    function: show
