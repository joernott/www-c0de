  - id: functions-frame-sheet
    file: site/public/tutorials/screenshots/functions-frame-sheet.webp
    page: site/tutorials/learning/functions.md
    title: Your own functions
    description: the program frame on its sheet, seen from above, with the two FUNCTION lines (framed and welcome), each with a NOOP line above it, and the three CALL framed lines at the south end
    program: frame
    program_file: site/tutorials/programs/learning/functions-frame.c0de
    function: welcome
    sheet: 20
    x: 640
    code: |
      PROGRAM frame
      NOOP
      CONSTANT BASE STRING "Oak Hill"
      NOOP
      FUNCTION framed
          PARAMETER text STRING
          PARAMETER row INTEGER 0
          PARAMETER column INTEGER 0
          RESULT width INTEGER
      BEGIN
          VARIABLE border STRING
          IF text = "" ;
          BEGIN
              RETURN
          END IF
          CALL LEN
              PARAMETER value text ;
              RESULT result width
          ASSIGN width width + 4 ;
          FOR i INTEGER 1 ; width ;
          BEGIN
              ASSIGN border border ⊕ "*" ;
          END FOR
          CALL LOCATE
              PARAMETER row row ;
              PARAMETER column column ;
          CALL PRINT
              PARAMETER value border ;
          CALL LOCATE
              PARAMETER row row + 1 ;
              PARAMETER column column ;
          CALL PRINT
              PARAMETER value "* " ⊕ text ⊕ " *" ;
          CALL LOCATE
              PARAMETER row row + 2 ;
              PARAMETER column column ;
          CALL PRINT
              PARAMETER value border ;
      END FUNCTION
      NOOP
      FUNCTION welcome
      BEGIN
          VARIABLE used INTEGER
          CALL CLS
          CALL framed
              PARAMETER text "Welcome" ;
              RESULT width used
          CALL framed
              PARAMETER text BASE ;
              PARAMETER column used + 1 ;
          CALL framed
              PARAMETER text "Mind the creepers!" ;
              PARAMETER row 4 ;
      END FUNCTION
