  - id: keeping-keys-create
    file: site/public/tutorials/screenshots/keeping-keys-create.webp
    page: site/tutorials/libraries/c0de/security/keeping-keys.md
    title: Keeping keys
    description: the dialog "Create your vault" with the fields Password and Repeat filled with dots, and the buttons OK and Cancel
    program: keys
    program_file: site/tutorials/programs/libraries/security/keeping-keys-keys.c0de
    function: store
    sheet: 94
