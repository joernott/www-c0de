# The tab of the tutorials (docs/tutorials.md): its chapter tabs are the three paths and the
# libraries of "Libraries in practice". Every chapter has an overview page (index.md in its
# folder); its lessons are the pages of the folder, in this order. Every page exists in every
# language of the site (de/tutorials/...). The import (scripts/import/tutorials.ts) adds the
# tab to the navigation and takes the titles of the lessons from their "# " headings.
tab:
  id: tutorials
  label: { en: Tutorials, de: Tutorials }
  color: tutorials
  link: /tutorials/

chapters:
  - link: /tutorials/learning/
    label: { en: Learning to program, de: Programmieren lernen }

  - link: /tutorials/programmers/
    label: { en: c0de for programmers, de: c0de für Programmierer }
    lessons:
      - ten-minutes
      - types
      - expressions
      - control-flow
      - functions
      - collections
      - errors
      - world
      - screens
      - data
      - cheat-sheet

  - link: /tutorials/libraries/
    label: { en: Libraries in practice, de: Bibliotheken in der Praxis }
  - link: /tutorials/libraries/c0de/math/
    label: { en: c0de/math, de: c0de/math }
  - link: /tutorials/libraries/c0de/strings/
    label: { en: c0de/strings, de: c0de/strings }
  - link: /tutorials/libraries/c0de/time/
    label: { en: c0de/time, de: c0de/time }
  - link: /tutorials/libraries/c0de/minecraft/
    label: { en: c0de/minecraft, de: c0de/minecraft }
  - link: /tutorials/libraries/c0de_net/http/
    label: { en: c0de_net/http, de: c0de_net/http }
